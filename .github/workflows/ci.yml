name: Garden Diary CI and Release

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Resolve pinned modules
        run: go mod tidy
      - name: Unit and API integration tests
        run: go test -race -count=1 ./...
      - name: Vet and compile
        run: |
          go vet ./...
          CGO_ENABLED=0 go build ./cmd/garden-diary

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Type check and production build
        run: npm run build

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate host scripts
        run: |
          bash -n deploy/install.sh
          bash -n scripts/garden-diary
      - name: Validate Compose
        env:
          GD_SETUP_TOKEN: ci-test-token
        run: docker compose -f deploy/docker-compose.yml config --quiet
      - name: Build API image
        run: docker build -f Dockerfile.api -t garden-diary-api:ci .
      - name: Build Web image
        run: docker build -f Dockerfile.web -t garden-diary-web:ci .

      - name: Start real Docker Compose stack and test HTTP flow
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/app-data"
          export GD_SETUP_TOKEN="test-deploy-secret"
          export GD_APP_IMAGE="garden-diary-api:ci"
          export GD_WEB_IMAGE="garden-diary-web:ci"
          export GD_UID="$(id -u)"
          export GD_GID="$(id -g)"
          export GD_DATA_DIR="$tmp/app-data"
          export GD_HTTP_PORT="13018"
          cleanup() {
            docker compose -f deploy/docker-compose.yml down >/dev/null 2>&1 || true
            rm -rf "$tmp"
          }
          trap cleanup EXIT
          docker compose -f deploy/docker-compose.yml up -d app web
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:13018/api/v1/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:13018/api/v1/health | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:13018/api/v1/bootstrap | grep -q '"needs_setup":true'
          curl -fsS http://127.0.0.1:13018/icon-192.png -o "$tmp/icon.png"
          file "$tmp/icon.png" | grep -q 'PNG image data'
          result="$(curl -fsS -c "$tmp/cookies" -H 'Content-Type: application/json' \
            -d '{"setup_token":"test-deploy-secret","username":"gardener","display_name":"Garden","password":"test-password-123"}' \
            http://127.0.0.1:13018/api/v1/setup)"
          csrf="$(python3 -c 'import json,sys;print(json.load(sys.stdin)["csrf"])' <<<"$result")"
          curl -fsS -b "$tmp/cookies" -H 'Content-Type: application/json' -H "X-CSRF-Token: $csrf" \
            -d '{"name":"Rose"}' http://127.0.0.1:13018/api/v1/species | grep -q '"name":"Rose"'
          curl -fsS -b "$tmp/cookies" http://127.0.0.1:13018/api/v1/species | grep -q '"name":"Rose"'

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: [backend, frontend, deployment]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Compute exact image tag
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/garden-diary-api:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Publish Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/garden-diary-web:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Publish stable release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          assets=(deploy/install.sh deploy/docker-compose.yml deploy/Caddyfile.http deploy/Caddyfile.https deploy/.env.example scripts/garden-diary)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --title "Garden Diary $GITHUB_REF_NAME" --generate-notes
          fi
